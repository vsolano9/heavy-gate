[package]
name = "heavy-gate"
version = "1.0.0"
edition = "2021"
description = "Machine-wide gate for heavy commands (builds, compiles, renders) shared by every agent session on one machine"
license = "MIT"
repository = "https://github.com/vsolano9/heavy-gate"
publish = false

[[bin]]
name = "heavy"
path = "src/main.rs"

[dependencies]
regex = "1"
serde_json = "1"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
